<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#161E33" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06D6A0" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="heartGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="heartGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer luminous accent ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-dasharray="24 12" opacity="0.65" filter="url(#glow)" />

  <!-- Shield / Card base -->
  <g transform="translate(256, 256) scale(0.95) translate(-256, -256)">
    <!-- Credit Card / Wallet Shape -->
    <rect x="116" y="156" width="280" height="180" rx="24" fill="#131C30" stroke="#1F2A44" stroke-width="4" />
    <path d="M 116 206 L 396 206" stroke="#0B0F19" stroke-width="24" />
    
    <!-- Chip -->
    <rect x="156" y="246" width="48" height="36" rx="6" fill="#F59E0B" opacity="0.9" />
    
    <!-- Couple Interlocking Hearts with Glow -->
    <g filter="url(#glow)">
      <!-- Left Heart (Emerald) -->
      <path d="M 230,285 A 25,25 0 0,0 205,250 A 25,25 0 0,0 180,275 Q 180,310 230,340 Q 280,310 280,275 A 25,25 0 0,0 255,250 A 25,25 0 0,0 230,285 Z" 
            fill="url(#heartGrad1)" opacity="0.95" />
      <!-- Right Heart (Violet) -->
      <path d="M 285,285 A 25,25 0 0,0 260,250 A 25,25 0 0,0 235,275 Q 235,310 285,340 Q 335,310 335,275 A 25,25 0 0,0 310,250 A 25,25 0 0,0 285,285 Z" 
            fill="url(#heartGrad2)" opacity="0.9" />
    </g>

    <!-- Grocery Cart Mini Badge -->
    <circle cx="340" cy="180" r="32" fill="#10B981" />
    <path d="M 324 172 L 330 172 L 336 188 L 354 188 L 358 176 L 332 176" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="338" cy="194" r="2.5" fill="#FFFFFF" />
    <circle cx="352" cy="194" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Currency / Love spark -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="3">DUO CONTROL</text>
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#06D6A0" letter-spacing="1.5">FINANZAS &amp; MERCADO</text>
</svg>