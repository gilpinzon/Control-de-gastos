<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#081426" rx="12"/>
  <!-- Printer Base -->
  <rect x="90" y="100" width="220" height="110" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
  <!-- Paper tray top -->
  <rect x="130" y="55" width="140" height="45" rx="4" fill="#334155"/>
  <rect x="145" y="65" width="110" height="35" rx="2" fill="#f8fafc"/>
  <!-- Output slot -->
  <rect x="120" y="150" width="160" height="15" rx="2" fill="#0f172a"/>
  <!-- Output paper -->
  <rect x="135" y="155" width="130" height="30" rx="2" fill="#e2e8f0"/>
  <!-- Buttons -->
  <circle cx="280" cy="125" r="5" fill="#f97316"/>
  <circle cx="265" cy="125" r="3" fill="#10b981"/>
  <text x="200" y="275" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="bold">Impresora Láser Somex (Baja)</text>
</svg>

